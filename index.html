<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Security Entry Compliance Verification Portal for authorized staff members.">
    <title>防摄盾</title>
    <link rel="icon" type="image/png" href="apple-touch-icon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="防摄盾">
    <meta name="theme-color" content="#015cf5">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="phone-container" id="phoneContainer">
            <div class="phone-content" id="phoneContent">
                <!-- Status bar mock (white strip of 1/50 height) -->
                <div class="status-bar-mock"></div>

                <!-- Background overlay for the generated isometric security image -->
                <div class="bg-overlay" id="bgOverlay"></div>

                <!-- Top user identifier -->
                <header class="header-container" id="userIdContainer" title="Nhấp 2 lần để đổi tên và mã nhân viên" style="cursor: pointer;">
                    <h1 class="user-id">
                        <span id="empId">N2632049</span><span id="empName">(丁德順)</span>
                    </h1>
                </header>

                <!-- Compliance Check Card -->
                <main class="compliance-card" id="complianceCard">
                    <div class="card-header" id="cardHeader" title="Nhấp 2 lần để chuyển đổi giữa Vào và Ra (Mã QR)" style="cursor: pointer;">
                        您的设备已符合安全规范
                    </div>
                    
                    <div class="card-body">
                        <!-- Ticking clock (shows current time) -->
                        <div class="current-time" id="currentTime">
                            2026-7-2 07:53:41
                        </div>
                        
                        <!-- Compliance checkmark logo -->
                        <div class="icon-wrapper">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20 6L9 17L4 12" />
                            </svg>
                        </div>
                        
                        <!-- Status indicators grouped -->
                        <div class="status-group">
                            <h2 class="status-title">Successful entry</h2>
                            <div class="entry-time" id="entryTime">2026-07-02 07:52</div>
                        </div>

                        <!-- QR Code mock for exit gate -->
                        <div class="qr-wrapper" id="qrWrapper" title="Nhấp 2 lần để chuyển đổi lại">
                            <img src="qr_code.png" class="qr-code-img" alt="二维码">
                        </div>
                        
                        <button class="refresh-btn" id="refreshBtn">刷新二维码</button>
                        
                        <!-- Timer indicators grouped -->
                        <div class="timer-group">
                            <div class="active-status">已生效</div>
                            <div class="countdown-timer" id="countdownTimer">00:59</div>
                        </div>
                    </div>
                </main>

                <!-- Dynamic warning / instructions at footer -->
                <footer class="footer-text" id="footerText">
                    尊敬的員工您好，您已進入訊越涉密區域，出於安全考慮，您的手機攝像頭將被禁止使用，感謝您的配合。
                </footer>
            </div>
        </div>
    </div>


    <!-- Edit User ID Modal -->
    <div class="settings-modal" id="editUserModal">
        <div class="settings-content">
            <h3>Đổi mã nhân viên & Tên</h3>
            <div class="form-group">
                <label for="inputEditEmpId">Mã nhân viên (User ID)</label>
                <input type="text" id="inputEditEmpId" placeholder="N2632049">
            </div>
            <div class="form-group">
                <label for="inputEditEmpName">Họ và tên (Name)</label>
                <input type="text" id="inputEditEmpName" placeholder="丁德順">
            </div>
            <div class="settings-actions">
                <button class="btn btn-cancel" id="btnEditCancel">Hủy</button>
                <button class="btn btn-save" id="btnEditSave">Lưu</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
