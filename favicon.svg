<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (vibrant modern blue) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#147aff"/>
      <stop offset="100%" stop-color="#0056f6"/>
    </linearGradient>

    <!-- Mask to cleanly cut out the diagonal strike-through from the camera body and lens -->
    <mask id="strikeMask">
      <!-- Keep everything by default (white) -->
      <rect width="512" height="512" fill="#ffffff" />
      <!-- Cut out the diagonal line (black) with a slightly wider stroke to create a clean gap -->
      <line x1="180" y1="297" x2="332" y2="193" stroke="#000000" stroke-width="26" stroke-linecap="round" />
    </mask>

    <!-- Mask to cut a transparent lens ring out of the camera body -->
    <mask id="lensMask">
      <!-- Keep the camera body by default (white) -->
      <rect width="512" height="512" fill="#ffffff" />
      <!-- Cut out the lens circle (black) -->
      <circle cx="256" cy="251" r="36" fill="#000000" />
    </mask>
  </defs>

  <!-- Background: Squircle / Rounded Square -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Shield Outline with parallel sides and rounded/soft bottom curve -->
  <path d="M 256 100
           C 290 110, 340 145, 385 125
           C 385 220, 385 365, 256 410
           C 127 365, 127 220, 127 125
           C 172 145, 222 110, 256 100 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="22" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- Camera Group with strike mask applied -->
  <g mask="url(#strikeMask)">
    <!-- Camera Body (solid white with lens cutout) -->
    <path d="M 190 200 
             L 215 200 
             L 225 180 
             A 6 6 0 0 1 231 176 
             L 281 176 
             A 6 6 0 0 1 287 180 
             L 297 200 
             L 322 200 
             A 12 12 0 0 1 334 212 
             L 334 290 
             A 12 12 0 0 1 322 302 
             L 190 302 
             A 12 12 0 0 1 178 290 
             L 178 212 
             A 12 12 0 0 1 190 200 Z" 
          fill="#ffffff" 
          mask="url(#lensMask)" />
          
    <!-- Camera Lens Inner White Circle (the center dot) -->
    <circle cx="256" cy="251" r="20" fill="#ffffff" />
  </g>

  <!-- Strike-through Line (drawn on top of masked camera, using the exact same coordinates but smaller width) -->
  <line x1="180" y1="297" x2="332" y2="193" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />

  <!-- Text: 防摄盾 (sized and positioned to fit inside the shield) -->
  <text x="256" y="352" 
        fill="#ffffff" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Microsoft YaHei', sans-serif" 
        font-size="38" 
        font-weight="900" 
        letter-spacing="4" 
        text-anchor="middle">防摄盾</text>
</svg>
